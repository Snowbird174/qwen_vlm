[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen_vlm"
version = "0.1.0"
description = "Lab-bench equipment completeness checking with Qwen3-VL-2B on Jetson Orin Nano"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen_vlm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and the base model"]
